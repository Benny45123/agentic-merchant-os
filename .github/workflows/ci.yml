name: CI Suite

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-checks:
    name: Backend Tests & Architecture Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Architecture Import-Graph Linter
        run: python scripts/check_import_graph.py

      - name: Run Pytest Suite (57 Tests)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENV: "test"
          RAZORPAY_KEY_ID: "rzp_test_placeholder"
          RAZORPAY_KEY_SECRET: "placeholder_secret"
          JWT_SIGNING_KEY: "test_secret_key"
        run: |
          cd backend
          pytest -v --asyncio-mode=auto

  frontend-checks:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Next.js Production Build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
          NEXT_PUBLIC_RAZORPAY_KEY_ID: "rzp_test_placeholder"
        run: npm run build

  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose File
        run: docker compose config
